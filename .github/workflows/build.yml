
name: Build Shanto Browser APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          unzip -q ShantoBrowser-ready-for-build.zip -d source

      - name: Build APK
        run: |
          cd source/ShantoBrowser
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShantoBrowser-debug-apk
          path: source/ShantoBrowser/app/build/outputs/apk/debug/*.apk
